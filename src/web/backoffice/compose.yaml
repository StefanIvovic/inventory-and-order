services:
  backoffice-spa:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE}
        NGINX_IMAGE: ${NGINX_IMAGE}
    profiles:
      - apps
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
