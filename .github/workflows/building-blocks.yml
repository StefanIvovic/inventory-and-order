name: building-blocks

on:
  pull_request:
    paths:
      - 'src/building-blocks/**'
      - 'tools/**'
      - 'scripts/**'
      - 'deploy/versions.env'
      - 'global.json'
      - 'nuget.config'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - '.github/workflows/building-blocks.yml'
  push:
    branches:
      - master
    paths:
      - 'src/building-blocks/**'
      - 'tools/**'
      - 'scripts/**'
      - 'deploy/versions.env'
      - 'global.json'
      - 'nuget.config'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - '.github/workflows/building-blocks.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Pre-pull test images
        run: |
          set -a
          . deploy/versions.env
          set +a
          for image in "$POSTGRES_IMAGE" "$RABBITMQ_IMAGE" "$RYUK_IMAGE"; do docker pull --quiet "$image"; done

      - name: Repository tool tests
        run: dotnet test --solution tools/RepoChecks.slnx

      - name: BuildingBlocks tests
        run: dotnet test --solution src/building-blocks/BuildingBlocks.slnx

      - name: Image pin check
        run: dotnet run --project tools/RepoChecks -- images

      - name: Pack shared packages
        shell: pwsh
        run: ./scripts/pack.ps1

      - name: Consumer check AspNetCore
        shell: pwsh
        run: ./scripts/check-consumer.ps1 -PackageId BuildingBlocks.AspNetCore

      - name: Consumer check EntityFrameworkCore
        shell: pwsh
        run: ./scripts/check-consumer.ps1 -PackageId BuildingBlocks.EntityFrameworkCore

      - name: Consumer check Testing
        shell: pwsh
        run: ./scripts/check-consumer.ps1 -PackageId BuildingBlocks.Testing

      - name: Test cleanup check
        if: always()
        shell: pwsh
        run: ./scripts/check-test-cleanup.ps1
