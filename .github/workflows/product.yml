name: product

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/services/product/**'
      - '.github/workflows/product.yml'
  push:
    branches:
      - master
    paths:
      - 'src/services/product/**'
      - '.github/workflows/product.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Load image versions
        run: grep -E '^[A-Z][A-Z0-9_]*=' deploy/versions.env >> "$GITHUB_ENV"

      - name: Restore package feed from tag
        shell: pwsh
        run: ./scripts/restore-feed.ps1 -Service product

      - name: Pre-pull test images
        run: for image in "$POSTGRES_IMAGE" "$RABBITMQ_IMAGE" "$RYUK_IMAGE"; do docker pull --quiet "$image"; done

      - name: Tests (unit, integration, no-roles route test)
        run: dotnet test --solution src/services/product/Product.slnx

      - name: Generated code is up to date
        shell: pwsh
        run: ./scripts/codegen.ps1 -Service product -Check

      - name: Image pin check
        run: dotnet run --project tools/RepoChecks -- images

      - name: Package pin check
        run: dotnet run --project tools/RepoChecks -- packages

      - name: Smoke start in Static mode
        shell: pwsh
        run: ./scripts/dev.ps1 up -Profile infra,apps -Service product-api

      - name: Smoke checks
        run: |
          docker exec inventory-and-order-product-api-1 wget -q -O /dev/null http://localhost:8080/health/ready
          docker exec inventory-and-order-product-api-1 wget -S -O /dev/null http://localhost:8080/roles 2>&1 | grep -q "HTTP/1.1 401"
          test -z "$(docker port inventory-and-order-product-api-1)"
          docker logs inventory-and-order-product-api-1 2>&1 | grep -q "code generation mode is Static"

      - name: Dev stack reset
        if: always()
        shell: pwsh
        run: ./scripts/dev.ps1 reset

      - name: Cleanup check
        if: always()
        shell: pwsh
        run: ./scripts/check-test-cleanup.ps1 -Project inventory-and-order
